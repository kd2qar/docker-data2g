x-anchors:
  HOST_IP: &hostip ${HOST_IP:-127.0.0.1}


services:
  data2g:
    container_name: data2g
    build:
      context: .
      dockerfile: Dockerfile
    image: kd2qar/data2g
    hostname: data2g
    entrypoint: 
      - "/data2g/data2g"
      - "web"
      - "--web-port"
      - "8041"
      - "--web-listen"
      - "0.0.0.0"
    devices:
      - source: /dev/snd
        target: /dev/snd
        permissions: rwm
      - source: /dev/ttyUSB0
        target: /dev/ttyUSB0
        permissions: rwm
    volumes:
      - /etc/localtime:/etc/localtime:ro
      #- type: bind
        #source: ./config/data2g.conf
        #target: /root/.config/Data2G/data2g.conf
        #read_only: false
      - type: bind
        source: ./config
        target: /root/.config/Data2G
    ports:
      #- host_ip: *hostip
      #  protocol: tcp
      #  target: 80
      #  published: 8088
      #- host_ip: *hostip
      #  protocol: tcp
      #  target: 443
      #  published: 4444
      # web interface port
      - host_ip: *hostip
        protocol: tcp
        target: 8041
        published: 8041
      # kiss port
      - host_ip: *hostip
        protocol: tcp
        target: 8100
        published: 8100
      # vara command port(s)
      - host_ip: *hostip
        protocol: tcp
        target: 8300
        published: 8300
      - host_ip: *hostip
        protocol: tcp
        target: 8301
        published: 8301

    group_add:
      - audio


